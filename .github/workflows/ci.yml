name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build & test (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Swift
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Run headless self-test
        run: swift run DittoMac --selftest

  package:
    name: Package DMG
    runs-on: macos-14
    needs: build
    # Build a DMG on every push to main and on tags; releases only on tags.
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Universal Ditto.app + DMG
        run: bash scripts/package-dmg.sh

      - name: Verify signature & universal architectures
        run: |
          codesign --verify --deep --strict .build/stage/Ditto.app
          codesign -dv .build/stage/Ditto.app 2>&1
          lipo -info .build/stage/Ditto.app/Contents/MacOS/Ditto

      - name: Upload versioned DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ditto-macOS-dmg
          path: dist/Ditto-macOS-*.dmg

      - name: Upload .app artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: Ditto.app
          path: .build/stage/Ditto.app
          if-no-files-found: ignore

      - name: Prepare bilingual release notes with verified SHA-256
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$NOTES"
          grep -q '^# .*（简体中文）$' "$NOTES"
          DMG_FILE=$(ls dist/Ditto-macOS-*.dmg | head -n 1)
          SHA256=$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')
          sed "s/{{SHA256}}/${SHA256}/g" "$NOTES" > .build/release-notes-rendered.md
          ! grep -q '{{SHA256}}' .build/release-notes-rendered.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ditto for macOS ${{ github.ref_name }}
          body_path: .build/release-notes-rendered.md
          files: dist/Ditto-macOS-*.dmg
